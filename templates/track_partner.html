<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body>
  <h1>Delivery Partner Tracking</h1>
  <div id="map"></div>

  <script>
    let map;
    let customerMarker;
    let parkingMarker;
    let partnerMarker;
    let websocket;
    let partnerID = "deliveryPartner123"; // Partner ID, this can be dynamically assigned
    let userLocation = null;
    let clickedLocation = null;
    let directionsService;
    let directionsRenderer;

    // Initialize the map
    function initMap() {
      const initialLocation = { lat: 18.5204, lng: 73.8567 };

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: initialLocation,
      });

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({ suppressMarkers: false });
      directionsRenderer.setMap(map);

      // Start WebSocket connection to receive customer and parking location updates
      connectWebSocket();
      
      // Start tracking the delivery partner's location
      startLiveTracking();
    }

    // Connect to WebSocket for receiving updates
    function connectWebSocket() {
      websocket = new WebSocket(`ws://localhost:8082/websocket?role=partner&partner_id=${partnerID}`);

      websocket.onmessage = function (event) {
        const message = JSON.parse(event.data);

        // Handle assignment message with customer and parking location
        if (message.type === "assignment") {
          const customerLocation = message.customer_location;
          const parkingLocation = message.parking_location;

          // Update markers for customer and parking spot
          updateCustomerMarker(customerLocation);
          updateParkingMarker(parkingLocation);

          // Optionally, show route between customer and parking spot
          showRoute(customerLocation, parkingLocation);
        }

        // Handle partner's live location updates
        if (message.type === "partner.location") {
          const partnerLocation = { lat: message.lat, lng: message.lng };
          updatePartnerMarker(partnerLocation);
        }
      };

      websocket.onerror = function (error) {
        console.error("WebSocket Error:", error);
      };

      websocket.onclose = function () {
        console.log("WebSocket connection closed.");
      };
    }

    // Start live tracking for the delivery partner
    function startLiveTracking() {
      if (!navigator.geolocation) {
        console.warn("Geolocation is not supported by your browser.");
        return;
      }

      navigator.geolocation.watchPosition(
        (position) => {
          userLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude,
          };
          addPartnerMarker(userLocation);
          map.panTo(userLocation); // Center map on partner location
          sendLocationToBackend(userLocation); // Send delivery partner location to backend
        },
        (error) => {
          console.error("Live tracking error:", error.message);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0,
        }
      );
    }

    // Add a marker for the delivery partner's location
    function addPartnerMarker(latlng) {
      if (partnerMarker) {
        partnerMarker.setPosition(latlng);
      } else {
        partnerMarker = new google.maps.Marker({
          position: latlng,
          map,
          title: "Delivery Partner",
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#FF0000",  // Red color for the partner's marker
            fillOpacity: 1,
            strokeColor: "#ffffff",
            strokeWeight: 2,
          },
        });
      }
    }

    // Update the customer's location marker on the map
    function updateCustomerMarker(location) {
      if (!customerMarker) {
        customerMarker = new google.maps.Marker({
          position: location,
          map,
          title: "Customer Location",
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#4285F4",  // Blue color for customer
            fillOpacity: 1,
            strokeColor: "#ffffff",
            strokeWeight: 2,
          },
        });
      } else {
        customerMarker.setPosition(location);
      }

      map.panTo(location); // Center map on customer's location
    }

    // Update the parking spot marker on the map
    function updateParkingMarker(location) {
      if (!parkingMarker) {
        parkingMarker = new google.maps.Marker({
          position: location,
          map,
          title: "Parking Spot",
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#00FF00",  // Green color for parking spot
            fillOpacity: 1,
            strokeColor: "#ffffff",
            strokeWeight: 2,
          },
        });
      } else {
        parkingMarker.setPosition(location);
      }
    }

    // Show the route between the customer and parking location
    function showRoute(customerLocation, parkingLocation) {
      directionsService.route(
        {
          origin: customerLocation,
          destination: parkingLocation,
          travelMode: google.maps.TravelMode.DRIVING,
        },
        (result, status) => {
          if (status === google.maps.DirectionsStatus.OK) {
            directionsRenderer.setDirections(result);
          } else {
            alert("Could not get directions: " + status);
          }
        }
      );
    }

    // Send the delivery partner's location to the backend
    async function sendLocationToBackend(location) {
      const data = { location };

      try {
        const response = await fetch('/api/update-partner-location', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (response.ok) {
          console.log("Partner's location sent to backend.");
        } else {
          console.error("Failed to send location to backend.");
        }
      } catch (error) {
        console.error("Error sending location to backend:", error);
      }
    }

    // Initialize map when page loads
    window.onload = initMap;
  </script>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Delivery Partner – Pickup & Drop + Live Location</title>
  <style>
    #map{height:80vh;width:100%}
    #bar{padding:10px;background:#f1f1f1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    input,button,label{padding:6px 8px}
    .pill{background:#e8e8e8;border-radius:999px;padding:4px 8px}
    .spacer{flex:1}
  </style>
</head>
<body>
<div id="bar">
  <label>Order ID</label>
  <input id="orderId" placeholder="ORD123" style="width:140px"/>
  <label>Partner ID</label>
  <input id="partnerId" placeholder="P1" style="width:100px"/>
  <button id="btnConnect">Connect & Share Live</button>
  <button id="btnStop" disabled>Stop</button>
  <span id="wsStatus" class="pill">WS: offline</span>
  <span id="gpsStatus" class="pill">GPS: idle</span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="chkRouteToPickup" checked/> Route to Pickup</label>
  <label><input type="checkbox" id="chkRouteToDrop"/> Pickup → Drop</label>
  <button id="btnFit">Recenter</button>
</div>

<div id="map"></div>

<script>
let map, pickupMarker, dropMarker, myMarker;
let directionsService, routeToPickupRenderer, routeToDropRenderer;
let ws = null, watchId = null;

// --- Map setup ---
function initMap(){
  map = new google.maps.Map(document.getElementById("map"), {
    zoom: 13, center: {lat:18.5204, lng:73.8567}
  });
  directionsService = new google.maps.DirectionsService();
  routeToPickupRenderer = new google.maps.DirectionsRenderer({map});
  routeToDropRenderer   = new google.maps.DirectionsRenderer({map});
  clearRoutes();
}
function clearRoutes(){
  routeToPickupRenderer.set('directions', null);
  routeToDropRenderer.set('directions', null);
}

function setPickup(ll){
  if (pickupMarker) pickupMarker.setMap(null);
  pickupMarker = new google.maps.Marker({
    position: ll, map, title: "Pickup (Customer)",
    icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:"#34a853",fillOpacity:1,strokeColor:"#fff",strokeWeight:2}
  });
  maybeDrawRoutes();
}
function setDrop(ll){
  if (dropMarker) dropMarker.setMap(null);
  dropMarker = new google.maps.Marker({
    position: ll, map, title: "Drop (Parking)",
    icon: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
  });
  maybeDrawRoutes();
}
function setMe(ll){
  if (!myMarker) {
    myMarker = new google.maps.Marker({
      position: ll, map, title: "Me (Partner)",
      icon: "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
    });
  } else {
    myMarker.setPosition(ll);
  }
  maybeDrawRoutes();
}
function fit(){
  const b = new google.maps.LatLngBounds(); let any=false;
  [pickupMarker, dropMarker, myMarker].forEach(m => { if (m){ b.extend(m.getPosition()); any=true; }});
  if (any) map.fitBounds(b);
}

// --- Routing ---
async function drawRoute(origin, destination, renderer){
  return new Promise((resolve) => {
    directionsService.route({
      origin, destination, travelMode: google.maps.TravelMode.DRIVING
    }, (res, status) => {
      if (status === google.maps.DirectionsStatus.OK) renderer.setDirections(res);
      else renderer.set('directions', null);
      resolve();
    });
  });
}
async function maybeDrawRoutes(){
  const routePickup = document.getElementById("chkRouteToPickup").checked;
  const routeDrop   = document.getElementById("chkRouteToDrop").checked;

  if (routePickup && myMarker && pickupMarker) {
    await drawRoute(myMarker.getPosition(), pickupMarker.getPosition(), routeToPickupRenderer);
  } else routeToPickupRenderer.set('directions', null);

  if (routeDrop && pickupMarker && dropMarker) {
    await drawRoute(pickupMarker.getPosition(), dropMarker.getPosition(), routeToDropRenderer);
  } else routeToDropRenderer.set('directions', null);
}

// --- WS + GPS ---
function connect(){
  const oid = document.getElementById("orderId").value.trim();
  const pid = document.getElementById("partnerId").value.trim();
  if (!oid || !pid) return alert("Enter Order ID and Partner ID");

  // Preload order info (pickup/drop)
  fetch(`/api/order/${encodeURIComponent(oid)}`)
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (j?.data?.pickup) setPickup(j.data.pickup);
      if (j?.data?.drop)   setDrop(j.data.drop);
      fit();
    })
    .catch(()=>{});

  // WebSocket
  const proto = (location.protocol === "https:") ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?orderId=${encodeURIComponent(oid)}&role=partner&partnerId=${encodeURIComponent(pid)}`);
  ws.onopen  = () => setWS("online");
  ws.onclose = () => setWS("offline");
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "order_info") {
      if (msg.pickup) setPickup(msg.pickup);
      if (msg.drop)   setDrop(msg.drop);
      fit();
    }
  };

  // Start GPS
  if (!navigator.geolocation) { alert("Geolocation not supported"); return; }
  setGPS("starting");
  watchId = navigator.geolocation.watchPosition(p => {
    const loc = { lat: p.coords.latitude, lng: p.coords.longitude };
    setMe(loc);
    setGPS("online");
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type:"partner_location", lat: loc.lat, lng: loc.lng }));
    }
  }, err => {
    console.error(err);
    setGPS("error");
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:0 });

  // UI state
  document.getElementById("btnConnect").disabled = true;
  document.getElementById("btnStop").disabled = false;
}

function stopAll(){
  if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (ws) { try{ ws.close(); }catch{} ws=null; }
  setWS("offline"); setGPS("idle");
  document.getElementById("btnConnect").disabled = false;
  document.getElementById("btnStop").disabled = true;
}

function setWS(state){
  document.getElementById("wsStatus").textContent = `WS: ${state}`;
}
function setGPS(state){
  document.getElementById("gpsStatus").textContent = `GPS: ${state}`;
}

// --- UI wiring ---
document.getElementById("btnConnect").addEventListener("click", connect);
document.getElementById("btnStop").addEventListener("click", stopAll);
document.getElementById("btnFit").addEventListener("click", fit);
document.getElementById("chkRouteToPickup").addEventListener("change", maybeDrawRoutes);
document.getElementById("chkRouteToDrop").addEventListener("change", maybeDrawRoutes);

// cleanup on page leave
window.addEventListener("beforeunload", stopAll);
</script>

<script async defer src="https://maps.googleapis.com/maps/api/js?key={{.google_maps_api_key}}&callback=initMap"></script>
</body>
</html>
