<!DOCTYPE html>
<html>
<head>
  <title>Nearby Parking Spots</title>
  <meta charset="utf-8" />
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    async function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 15,
        center: { lat: 18.50, lng: 73.8505 }, // fallback center
      });

      try {
        const response = await fetch("http://localhost:8080/api/parking-spots/nearby?lat=18.50&lng=73.8505");
        const json = await response.json();
        const spots = json.data;

        console.log("Parking spots:", spots);

        if (!spots.length) {
          alert("No parking spots found nearby.");
          return;
        }

        const bounds = new google.maps.LatLngBounds();

        spots.forEach(spot => {
          const position = { lat: spot.lat, lng: spot.lng };

          const marker = new google.maps.Marker({
            position,
            map,
            title: spot.name,
          });

          const infoWindow = new google.maps.InfoWindow({
            content: `<strong>${spot.name}</strong><br>Lat: ${spot.lat}<br>Lng: ${spot.lng}`
          });

          marker.addListener("click", () => {
            infoWindow.open(map, marker);
          });

          bounds.extend(position);
        });

        map.fitBounds(bounds);  // Fit the map to show all markers
      } catch (err) {
        console.error("Map error:", err);
        alert("Error loading map data.");
      }
    }
  </script>

  <!-- Use async & defer for proper loading -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC2CoAFolpCsbZIH7WmwFqEv1Ska1vto5w&callback=initMap"
    async defer>
  </script>
</body>
</html>
