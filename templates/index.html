<!DOCTYPE html>
<html>
<head>
  <title>Nearby Parking Spots</title>
  <meta charset="utf-8" />
  <style>
    #map { height: 90vh; width: 100%; }
    #search-container {
      padding: 10px; background: #f1f1f1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    input[type="text"], input[type="search"] { width: 300px; padding: 6px; }
    button { padding: 6px 10px; }
    .pill { padding: 4px 8px; border-radius: 999px; background: #e8e8e8; }
  </style>
</head>
<body>

  <div id="search-container">
    <input type="text" id="addressInput" placeholder="Enter address..." />
    <button id="btnSearch" onclick="searchAddress()">Search</button>

    <input type="search" id="orderId" placeholder="Order ID (e.g. ORD123)" style="width: 200px;" />
    <button id="btnSave">Save Pickup & Drop</button>
    <button id="btnReset">Reset Spots</button>
    <span id="wsStatus" class="pill">WS: offline</span>

    <!-- Live HUD + controls -->
    <span id="liveStatus" class="pill">LIVE: —</span>
    <span id="partnerInfo" class="pill">Partner: —</span>
    <span id="distLeft" class="pill">Dist to pickup: —</span>
    <label class="pill" style="background:#fff;border:1px solid #ddd;">
      <input type="checkbox" id="chkFollow" checked /> Follow partner
    </label>
    <button id="btnRecenter">Recenter</button>
  </div>

  <div id="map"></div>

  <script>
    let map;
    let autocomplete;
    let userMarker;          // pickup marker (customer)
    let partnerMarker;       // live partner marker (red)
    let dropMarker;          // selected parking spot (blue)
    let userLocation = null; // {lat,lng}
    let directionsService;
    let directionsRenderer;  // for pickup -> drop (your original route, gray optional)

    let lastPartnerUpdateAt = null;

    // parking markers
    let parkingMarkers = [];
    let selectedParkingMarker = null;

    // websocket
    let ws = null;

    // ======== Partner -> Pickup remaining route (BLACK ONLY) ========
    let partnerRoutePolyline = null;   // remaining route (shrinks, black)
    let partnerRouteFullPath = null;   // LatLng[] overview path when computed
    let lastRouteOrigin = null;        // LatLng partner position when route computed
    let lastRouteComputeAt = 0;        // ms timestamp
    const REROUTE_MIN_DISTANCE_M = 120;
    const REROUTE_MIN_INTERVAL_MS = 60000;

    async function initMap() {
      const fallbackLocation = { lat: 18.5204, lng: 73.8567 };

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: fallbackLocation,
      });

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({
        suppressMarkers: false,
        // (optional) draw your pickup->drop in neutral gray so the black partner->pickup stands out
        polylineOptions: { strokeColor: "#9E9E9E", strokeOpacity: 0.8, strokeWeight: 4 }
      });
      directionsRenderer.setMap(map);

      const input = document.getElementById("addressInput");
      autocomplete = new google.maps.places.Autocomplete(input);
      autocomplete.bindTo("bounds", map);

      autocomplete.addListener("place_changed", async () => {
        const place = autocomplete.getPlace();
        if (!place || !place.geometry || !place.geometry.location) return;
        const location = {
          lat: place.geometry.location.lat(),
          lng: place.geometry.location.lng(),
        };
        userLocation = location;
        addUserMarker(location);
        map.setCenter(location);
        map.setZoom(15);
        clearParkingMarkers();
        await loadParkingSpots(location);
        clearPartnerRoute(); // pickup changed
      });

      try {
        const loc = await getUserLocationOnce();
        if (loc) {
          userLocation = loc;
          addUserMarker(userLocation);
          await loadParkingSpots(userLocation);
          startLiveTracking(); // optional: if the customer's own position moves
        } else {
          alert("Unable to get your location. Please use the address input to search manually.");
        }
      } catch (err) {
        console.warn("Geolocation error:", err.message);
        alert("Geolocation not allowed. Please use the search box to find parking near you.");
      }

      document.getElementById("btnSave").addEventListener("click", onSaveOrder);
      document.getElementById("btnReset").addEventListener("click", async () => {
        if (!userLocation) return;
        directionsRenderer.set('directions', null);
        if (dropMarker) { dropMarker.setMap(null); dropMarker = null; }
        clearParkingMarkers();
        await loadParkingSpots(userLocation);
        clearPartnerRoute();
        document.getElementById("distLeft").textContent = "Dist to pickup: —";
      });
      document.getElementById("btnRecenter").addEventListener("click", fitAllMarkers);

      setInterval(updateLiveStatus, 1000);
    }

    function getUserLocationOnce() {
      return new Promise((resolve) => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              resolve({ lat: position.coords.latitude, lng: position.coords.longitude });
            },
            () => resolve(null),
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
          );
        } else {
          resolve(null);
        }
      });
    }

    function startLiveTracking() {
      if (!navigator.geolocation) return;
      navigator.geolocation.watchPosition(
        (position) => {
          userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
          addUserMarker(userLocation);
          if (dropMarker) drawRoute(userLocation, dropMarker.getPosition());
          clearPartnerRoute(); // pickup moved -> recompute next time
        },
        (error) => console.error("Live tracking error:", error.message),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function addUserMarker(latlng) {
      if (userMarker) {
        userMarker.setPosition(latlng);
      } else {
        userMarker = new google.maps.Marker({
          position: latlng,
          map,
          title: "Pickup (You)",
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#34a853",
            fillOpacity: 1,
            strokeColor: "#ffffff",
            strokeWeight: 2,
          },
        });
      }
    }

    function clearParkingMarkers() {
      parkingMarkers.forEach(m => m.setMap(null));
      parkingMarkers = [];
      selectedParkingMarker = null;
    }

    async function loadParkingSpots(center) {
      try {
        const response = await fetch(`/api/parking-spots/nearby?lat=${center.lat}&lng=${center.lng}`);
        const json = await response.json();
        const spots = json.data || [];

        if (!spots.length) { alert("No parking spots found nearby."); return; }

        const bounds = new google.maps.LatLngBounds();
        bounds.extend(center);

        spots.forEach((spot) => {
          const position = { lat: spot.lat, lng: spot.lng };
          const marker = new google.maps.Marker({ position, map, title: spot.name });
          parkingMarkers.push(marker);

          const infoWindow = new google.maps.InfoWindow({
            content: `<strong>${spot.name}</strong><br>Lat: ${spot.lat.toFixed(6)}<br>Lng: ${spot.lng.toFixed(6)}`,
          });

          marker.addListener("click", () => {
            infoWindow.open(map, marker);
            if (!userLocation) { alert("User location not available yet."); return; }
            setDrop(position);
            drawRoute(userLocation, position);
            hideOtherParkingMarkers(marker);
            selectedParkingMarker = marker;
            fitAllMarkers();
          });

          bounds.extend(position);
        });

        map.fitBounds(bounds);
      } catch (err) {
        console.error("Map error:", err);
        alert("Error loading parking data.");
      }
    }

    function hideOtherParkingMarkers(keepMarker) {
      parkingMarkers.forEach(m => { if (m !== keepMarker) m.setMap(null); });
    }

    function setDrop(latlng) {
      if (dropMarker) dropMarker.setMap(null);
      dropMarker = new google.maps.Marker({
        position: latlng,
        map,
        title: "Drop (Parking)",
        icon: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png",
      });
      fitAllMarkers();
    }

    function fitAllMarkers() {
      const b = new google.maps.LatLngBounds();
      let any = false;
      if (userMarker) { b.extend(userMarker.getPosition()); any = true; }
      if (dropMarker) { b.extend(dropMarker.getPosition()); any = true; }
      if (partnerMarker) { b.extend(partnerMarker.getPosition()); any = true; }
      if (any) map.fitBounds(b);
    }

    function drawRoute(origin, destination) {
      directionsService.route(
        { origin, destination, travelMode: google.maps.TravelMode.DRIVING },
        (result, status) => {
          if (status === google.maps.DirectionsStatus.OK) {
            directionsRenderer.setDirections(result);
          } else {
            console.warn("Could not get directions:", status);
          }
        }
      );
    }

    async function onSaveOrder() {
      const orderId = document.getElementById("orderId").value.trim();
      if (!orderId) return alert("Please enter an Order ID.");
      if (!userLocation) return alert("Pickup not available yet.");
      if (!dropMarker) return alert("Please select a parking spot as Drop.");

      const payload = {
        orderId,
        pickup: { lat: userLocation.lat, lng: userLocation.lng },
        drop:   { lat: dropMarker.getPosition().lat(), lng: dropMarker.getPosition().lng() }
      };

      try {
        const res = await fetch("/api/order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || "Save failed");
        alert("Order saved. Share Order ID with your delivery partner.");
        connectWS(orderId);
      } catch (e) {
        console.error(e);
        alert("Failed to save order.");
      }
    }

    // ======== Partner -> Pickup (BLACK remaining) helpers ========
    function clearPartnerRoute() {
      partnerRouteFullPath = null;
      lastRouteOrigin = null;
      lastRouteComputeAt = 0;
      if (partnerRoutePolyline) { partnerRoutePolyline.setMap(null); partnerRoutePolyline = null; }
      document.getElementById("distLeft").textContent = "Dist to pickup: —";
    }

    function maybeRecomputePartnerRoute(partnerPos) {
      if (!userLocation) return;
      if (!lastRouteOrigin || !partnerRouteFullPath) {
        return requestPartnerToPickupRoute(partnerPos, userLocation);
      }
      const now = Date.now();
      const moved = google.maps.geometry.spherical.computeDistanceBetween(
        new google.maps.LatLng(partnerPos.lat, partnerPos.lng),
        lastRouteOrigin
      );
      if (moved > REROUTE_MIN_DISTANCE_M || (now - lastRouteComputeAt) > REROUTE_MIN_INTERVAL_MS) {
        requestPartnerToPickupRoute(partnerPos, userLocation);
      }
    }

    function requestPartnerToPickupRoute(originLL, destLL) {
      const origin = new google.maps.LatLng(originLL.lat, originLL.lng);
      const dest   = new google.maps.LatLng(destLL.lat, destLL.lng);

      directionsService.route({
        origin,
        destination: dest,
        travelMode: google.maps.TravelMode.DRIVING,
        provideRouteAlternatives: false
      }, (res, status) => {
        if (status !== google.maps.DirectionsStatus.OK || !res.routes?.length) {
          console.warn("[partner-route] Directions failed:", status);
          return;
        }
        const route = res.routes[0];
        partnerRouteFullPath = route.overview_path.slice(); // LatLng[]
        lastRouteOrigin = origin;
        lastRouteComputeAt = Date.now();

        if (!partnerRoutePolyline) {
          partnerRoutePolyline = new google.maps.Polyline({
            map,
            path: partnerRouteFullPath,
            strokeWeight: 6,
            strokeOpacity: 1.0,
            strokeColor: "#000000",   // BLACK remaining distance
            zIndex: 1000,
            geodesic: true
          });
        } else {
          partnerRoutePolyline.setPath(partnerRouteFullPath);
        }

        // initial distance label
        updateRemainingDistanceFromPath(partnerRouteFullPath);
      });
    }

    function consumePartnerRouteWithPosition(partnerPos) {
      if (!partnerRouteFullPath || !partnerRouteFullPath.length) return;

      const posLL = new google.maps.LatLng(partnerPos.lat, partnerPos.lng);

      // Simple nearest-vertex approach (good enough for overview path)
      let nearestIdx = 0;
      let nearestDist = Infinity;
      for (let i = 0; i < partnerRouteFullPath.length; i++) {
        const d = google.maps.geometry.spherical.computeDistanceBetween(posLL, partnerRouteFullPath[i]);
        if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
      }

      // The remaining path becomes: current partner position + tail of the route
      const remaining = [posLL].concat(partnerRouteFullPath.slice(nearestIdx + 1));

      if (partnerRoutePolyline) partnerRoutePolyline.setPath(remaining);

      // Distance label
      updateRemainingDistanceFromPath(remaining);

      // Arrived: clear line near pickup
      if (userLocation) {
        const pickupLL = new google.maps.LatLng(userLocation.lat, userLocation.lng);
        const toPickup = google.maps.geometry.spherical.computeDistanceBetween(posLL, pickupLL);
        if (toPickup < 20) { // within 20 m
          if (partnerRoutePolyline) partnerRoutePolyline.setPath([]);
          document.getElementById("distLeft").textContent = "Dist to pickup: Arrived";
        }
      }
    }

    function updateRemainingDistanceFromPath(path) {
      if (!path || path.length < 2) { document.getElementById("distLeft").textContent = "Dist to pickup: —"; return; }
      let dist = 0;
      for (let i = 0; i < path.length - 1; i++) {
        dist += google.maps.geometry.spherical.computeDistanceBetween(path[i], path[i+1]);
      }
      document.getElementById("distLeft").textContent = "Dist to pickup: " + prettyDistance(dist);
    }

    function prettyDistance(meters) {
      if (meters < 1000) return `${Math.round(meters)} m`;
      return `${(meters/1000).toFixed(2)} km`;
    }
    // ======== end Partner -> Pickup helpers ========

    // Auto-reconnecting WebSocket with exponential backoff
    function connectWS(orderId) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();

      let backoff = 1000; // 1s -> 2s -> 4s ... capped at 10s

      const openSocket = () => {
        const proto = (location.protocol === "https:") ? "wss" : "ws";
        ws = new WebSocket(`${proto}://${location.host}/ws?orderId=${encodeURIComponent(orderId)}&role=customer`);

        ws.onopen  = () => { document.getElementById("wsStatus").textContent = "WS: online"; backoff = 1000; };
        ws.onclose = () => { document.getElementById("wsStatus").textContent = "WS: offline"; setTimeout(openSocket, Math.min(backoff, 10000)); backoff = Math.min(backoff * 2, 10000); };
        ws.onerror = () => ws.close();

        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          console.log("[WS customer] message:", msg);

          if (msg.type === "partner_location") {
            const pos = { lat: msg.lat, lng: msg.lng };

            if (!partnerMarker) {
              partnerMarker = new google.maps.Marker({
                position: pos,
                map,
                title: "Delivery Partner",
                icon: "https://maps.google.com/mapfiles/ms/icons/red-dot.png",
              });
            } else {
              partnerMarker.setPosition(pos);
            }

            if (document.getElementById("chkFollow").checked) map.panTo(pos);

            lastPartnerUpdateAt = Date.now();
            document.getElementById("partnerInfo").textContent = `Partner: ${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)}`;
            updateLiveStatus();

            if (userLocation) {
              maybeRecomputePartnerRoute(pos);     // sometimes recompute
              consumePartnerRouteWithPosition(pos); // shrink black line + update distance
            }
          } else if (msg.type === "order_info") {
            if (msg.pickup) { userLocation = msg.pickup; addUserMarker(userLocation); clearPartnerRoute(); }
            if (msg.drop) setDrop(msg.drop);
            if (userLocation && dropMarker) drawRoute(userLocation, dropMarker.getPosition());
          }
        };
      };

      openSocket();
    }

    function updateLiveStatus() {
      const el = document.getElementById("liveStatus");
      if (!lastPartnerUpdateAt) { el.textContent = "LIVE: —"; el.style.background = "#e8e8e8"; return; }
      const age = Math.round((Date.now() - lastPartnerUpdateAt) / 1000);
      const live = age <= 8;
      el.textContent = live ? `LIVE: ${age}s ago` : `STALE: ${age}s ago`;
      el.style.background = live ? "#d4f8d4" : "#ffdcdc";
    }

    // Address search button handler
    async function searchAddress() {
      const place = autocomplete.getPlace();
      if (!place || !place.geometry || !place.geometry.location) {
        alert("Please select an address from suggestions.");
        return;
      }
      const location = {
        lat: place.geometry.location.lat(),
        lng: place.geometry.location.lng(),
      };

      userLocation = location;
      addUserMarker(location);
      map.setCenter(location);
      map.setZoom(15);

      directionsRenderer.set('directions', null);
      if (dropMarker) { dropMarker.setMap(null); dropMarker = null; }
      clearParkingMarkers();
      await loadParkingSpots(location);
      clearPartnerRoute();
    }
  </script>

  <!-- NOTE: geometry library is required for distance computations -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key={{.GoogleMapsApiKey}}&libraries=places,geometry&callback=initMap"
    async defer>
  </script>
</body>
</html>
