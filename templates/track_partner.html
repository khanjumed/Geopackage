<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Delivery Partner – Pickup & Drop + Live Location</title>
  <style>
    #map{height:80vh;width:100%}
    #bar{padding:10px;background:#f1f1f1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    input,button,label{padding:6px 8px}
    .pill{background:#e8e8e8;border-radius:999px;padding:4px 8px}
    .spacer{flex:1}
  </style>
</head>
<body>
<div id="bar">
  <label>Order ID</label>
  <input id="orderId" placeholder="ORD123" style="width:140px"/>
  <label>Partner ID</label>
  <input id="partnerId" placeholder="P1" style="width:100px"/>
  <button id="btnConnect">Connect & Share Live</button>
  <button id="btnStop" disabled>Stop</button>
  <span id="wsStatus" class="pill">WS: offline</span>
  <span id="gpsStatus" class="pill">GPS: idle</span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="chkRouteToPickup" checked/> Route to Pickup</label>
  <label><input type="checkbox" id="chkRouteToDrop"/> Pickup → Drop</label>
  <button id="btnFit">Recenter</button>
</div>

<div id="map"></div>

<script>
let map, pickupMarker, dropMarker, myMarker;
let directionsService, routeToPickupRenderer, routeToDropRenderer;
let ws = null, watchId = null;

// --- Map setup ---
function initMap(){
  map = new google.maps.Map(document.getElementById("map"), {
    zoom: 13, center: {lat:18.5204, lng:73.8567}
  });
  directionsService = new google.maps.DirectionsService();
  routeToPickupRenderer = new google.maps.DirectionsRenderer({map});
  routeToDropRenderer   = new google.maps.DirectionsRenderer({map});
  clearRoutes();
}
function clearRoutes(){
  routeToPickupRenderer.set('directions', null);
  routeToDropRenderer.set('directions', null);
}

function setPickup(ll){
  if (pickupMarker) pickupMarker.setMap(null);
  pickupMarker = new google.maps.Marker({
    position: ll, map, title: "Pickup (Customer)",
    icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:"#34a853",fillOpacity:1,strokeColor:"#fff",strokeWeight:2}
  });
  maybeDrawRoutes();
}
function setDrop(ll){
  if (dropMarker) dropMarker.setMap(null);
  dropMarker = new google.maps.Marker({
    position: ll, map, title: "Drop (Parking)",
    icon: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
  });
  maybeDrawRoutes();
}
function setMe(ll){
  if (!myMarker) {
    myMarker = new google.maps.Marker({
      position: ll, map, title: "Me (Partner)",
      icon: "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
    });
  } else {
    myMarker.setPosition(ll);
  }
  maybeDrawRoutes();
}
function fit(){
  const b = new google.maps.LatLngBounds(); let any=false;
  [pickupMarker, dropMarker, myMarker].forEach(m => { if (m){ b.extend(m.getPosition()); any=true; }});
  if (any) map.fitBounds(b);
}

// --- Routing ---
async function drawRoute(origin, destination, renderer){
  return new Promise((resolve) => {
    directionsService.route({
      origin, destination, travelMode: google.maps.TravelMode.DRIVING
    }, (res, status) => {
      if (status === google.maps.DirectionsStatus.OK) renderer.setDirections(res);
      else renderer.set('directions', null);
      resolve();
    });
  });
}
async function maybeDrawRoutes(){
  const routePickup = document.getElementById("chkRouteToPickup").checked;
  const routeDrop   = document.getElementById("chkRouteToDrop").checked;

  if (routePickup && myMarker && pickupMarker) {
    await drawRoute(myMarker.getPosition(), pickupMarker.getPosition(), routeToPickupRenderer);
  } else routeToPickupRenderer.set('directions', null);

  if (routeDrop && pickupMarker && dropMarker) {
    await drawRoute(pickupMarker.getPosition(), dropMarker.getPosition(), routeToDropRenderer);
  } else routeToDropRenderer.set('directions', null);
}

// --- WS + GPS ---
function connect(){
  const oid = document.getElementById("orderId").value.trim();
  const pid = document.getElementById("partnerId").value.trim();
  if (!oid || !pid) return alert("Enter Order ID and Partner ID");

  // Preload order info (pickup/drop)
  fetch(`/api/order/${encodeURIComponent(oid)}`)
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (j?.data?.pickup) setPickup(j.data.pickup);
      if (j?.data?.drop)   setDrop(j.data.drop);
      fit();
    })
    .catch(()=>{});

  // WebSocket
  const proto = (location.protocol === "https:") ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?orderId=${encodeURIComponent(oid)}&role=partner&partnerId=${encodeURIComponent(pid)}`);
  ws.onopen  = () => setWS("online");
  ws.onclose = () => setWS("offline");
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "order_info") {
      if (msg.pickup) setPickup(msg.pickup);
      if (msg.drop)   setDrop(msg.drop);
      fit();
    }
  };

  // Start GPS
  if (!navigator.geolocation) { alert("Geolocation not supported"); return; }
  setGPS("starting");
  watchId = navigator.geolocation.watchPosition(p => {
    const loc = { lat: p.coords.latitude, lng: p.coords.longitude };
    setMe(loc);
    setGPS("online");
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type:"partner_location", lat: loc.lat, lng: loc.lng }));
    }
  }, err => {
    console.error(err);
    setGPS("error");
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:0 });

  // UI state
  document.getElementById("btnConnect").disabled = true;
  document.getElementById("btnStop").disabled = false;
}

function stopAll(){
  if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (ws) { try{ ws.close(); }catch{} ws=null; }
  setWS("offline"); setGPS("idle");
  document.getElementById("btnConnect").disabled = false;
  document.getElementById("btnStop").disabled = true;
}

function setWS(state){
  document.getElementById("wsStatus").textContent = `WS: ${state}`;
}
function setGPS(state){
  document.getElementById("gpsStatus").textContent = `GPS: ${state}`;
}

// --- UI wiring ---
document.getElementById("btnConnect").addEventListener("click", connect);
document.getElementById("btnStop").addEventListener("click", stopAll);
document.getElementById("btnFit").addEventListener("click", fit);
document.getElementById("chkRouteToPickup").addEventListener("change", maybeDrawRoutes);
document.getElementById("chkRouteToDrop").addEventListener("change", maybeDrawRoutes);

// cleanup on page leave
window.addEventListener("beforeunload", stopAll);
</script>

<script async defer src="https://maps.googleapis.com/maps/api/js?key={{.google_maps_api_key}}&callback=initMap"></script>
</body>
</html>
